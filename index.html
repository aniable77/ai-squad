<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Combinze AI Squad — one workspace, many minds.">
<title>AI Squad — Combinze</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--sidebar:#0d1019;--panel:#121724;--panel2:#171e2d;--line:rgba(174,190,225,.12);--text:#f2f5ff;--muted:#8993a9;--purple:#9c83ff;--blue:#6aa9ff;--green:#6fe0b0;--danger:#ff7f91;--radius:17px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{height:100dvh;width:100%;display:grid;grid-template-columns:280px minmax(0,1fr);background:radial-gradient(ellipse at 70% -15%,rgba(93,88,180,.17),transparent 42%),var(--bg)}
.sidebar{min-width:0;display:flex;flex-direction:column;background:rgba(13,16,25,.96);border-right:1px solid var(--line);padding:19px 14px calc(14px + env(safe-area-inset-bottom));z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 21px}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,#9d7bff,#4b9eff);box-shadow:0 6px 24px #785ce944}
.brand-name{font-weight:850;letter-spacing:.11em;font-size:14px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.12em}
.new-chat{height:46px;border:1px solid rgba(160,139,255,.3);border-radius:13px;background:linear-gradient(110deg,rgba(133,96,232,.2),rgba(70,142,231,.12));display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;cursor:pointer;transition:.18s}
.new-chat:hover{border-color:#a38cff;background:linear-gradient(110deg,rgba(133,96,232,.3),rgba(70,142,231,.2))}
.side-label{display:flex;justify-content:space-between;align-items:center;color:#778198;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;padding:25px 9px 9px}
.chat-list{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:4px}
.chat-item{width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 10px;display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;color:#b6bfd1;min-width:0}
.chat-item:hover{background:#171d2a}
.chat-item.active{background:#1a2030;border-color:rgba(159,139,255,.2);color:#fff}
.chat-item .chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:13px}
.chat-item .chat-symbol{font-size:13px;color:#9e8bff}
.chat-item .delete-chat{opacity:0;border:0;background:transparent;color:#8b94a8;padding:3px 5px;border-radius:6px;cursor:pointer}
.chat-item:hover .delete-chat,.chat-item:focus-within .delete-chat{opacity:1}
.delete-chat:hover{color:var(--danger)!important;background:#33202a!important}
.side-bottom{border-top:1px solid var(--line);padding:14px 8px 0;margin-top:12px}
.squad-mini-title{font-size:10px;letter-spacing:.14em;color:#778198;font-weight:800;margin:2px 0 11px}
.agent-mini{display:flex;align-items:center;gap:9px;padding:7px 2px;color:#c2cad9;font-size:12px}
.agent-dot{width:27px;height:27px;border-radius:9px;background:#1b2232;display:grid;place-items:center;font-size:14px}
.online{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #6fe0b088}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.topbar{height:66px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(9,11,18,.7);backdrop-filter:blur(18px);z-index:2}
.top-left,.top-right{display:flex;align-items:center;gap:12px;min-width:0}
.mobile-menu{display:none}
.current-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-tag{font-size:10px;color:#a7e8cc;border:1px solid rgba(111,224,176,.18);background:rgba(111,224,176,.07);border-radius:99px;padding:6px 9px;letter-spacing:.08em}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#121825;color:#aeb8cb;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:#1b2434;color:white}
.content{flex:1;min-height:0;display:flex;flex-direction:column;max-width:1000px;width:100%;margin:0 auto;padding:0 30px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:36px 4px 24px;scroll-behavior:smooth;overscroll-behavior:contain}
.messages::-webkit-scrollbar,.chat-list::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb,.chat-list::-webkit-scrollbar-thumb{background:#293247;border-radius:20px}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px 10px 50px}
.welcome-mark{width:66px;height:66px;border-radius:23px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#30264f,#182e4b);border:1px solid rgba(169,145,255,.25);box-shadow:0 0 55px rgba(112,91,210,.18);margin-bottom:24px}
.welcome h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.045em;line-height:1.08;margin:0 0 13px;font-weight:800}
.welcome h1 span{background:linear-gradient(95deg,#b49aff,#79c6ff);color:transparent;background-clip:text}
.welcome p{max-width:470px;color:var(--muted);font-size:14px;line-height:1.7;margin:0}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,570px);margin-top:34px}
.suggestion{padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:rgba(19,25,39,.8);text-align:left;cursor:pointer;color:#d5dced;font-size:12px;line-height:1.45;transition:.18s}
.suggestion:hover{border-color:rgba(160,139,255,.45);background:#192235;transform:translateY(-2px)}
.suggestion b{display:block;font-size:12px;margin-bottom:5px;color:#fff}
.turn{display:flex;gap:14px;max-width:820px;margin:0 auto 27px;animation:appear .22s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.turn-avatar{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:15px;background:#1c2333;border:1px solid var(--line)}
.turn.user-turn .turn-avatar{background:linear-gradient(145deg,#785bd0,#397ab8);border:0}
.turn-body{min-width:0;flex:1;padding-top:4px}
.turn-name{font-size:11px;font-weight:800;letter-spacing:.02em;color:#aab4c9;margin-bottom:8px}
.turn-text{font-size:14px;line-height:1.75;color:#e4e9f4;white-space:pre-wrap;overflow-wrap:anywhere}
.turn.user-turn .turn-text{color:#fff}
.turn-text.error{color:#ff9ba9}
.turn-tools{display:flex;gap:7px;margin-top:11px}
.tiny-btn{font-size:10px;color:#8793a9;background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 8px;cursor:pointer}
.tiny-btn:hover{color:white;background:#1b2434}
.thinking-dots{display:flex;align-items:center;gap:5px;padding:5px 0}
.thinking-dots i{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:pulse 1.1s infinite ease-in-out}
.thinking-dots i:nth-child(2){animation-delay:.15s}.thinking-dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
.composer-wrap{flex:none;padding:8px 0 calc(19px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(9,11,18,.98) 17%)}
.composer{max-width:820px;margin:0 auto;border:1px solid rgba(164,177,211,.2);background:#141b29;border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 12px 40px #0005;display:flex;align-items:flex-end;gap:10px;transition:border-color .2s}
.composer:focus-within{border-color:rgba(159,137,255,.65);box-shadow:0 0 0 3px rgba(147,119,255,.08),0 12px 40px #0005}
.composer textarea{flex:1;min-width:0;max-height:180px;min-height:28px;resize:none;border:0;outline:0;background:transparent;color:#f3f5fb;font-size:14px;line-height:1.6;padding:4px 0}
.composer textarea::placeholder{color:#758096}
.send-btn{width:39px;height:39px;flex:none;border:0;border-radius:12px;background:linear-gradient(135deg,#9674f4,#4c96e9);display:grid;place-items:center;cursor:pointer;font-size:17px;box-shadow:0 5px 18px #775be944}
.send-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.composer-note{text-align:center;color:#657087;font-size:10px;margin-top:10px}
.mobile-backdrop{display:none}
.empty-list{color:#68738a;font-size:12px;padding:12px 9px}
@media(max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,310px);transform:translateX(-105%);transition:transform .22s ease;box-shadow:20px 0 60px #0008}
 .app.menu-open .sidebar{transform:translateX(0)}
 .mobile-backdrop{display:block;position:fixed;inset:0;background:#0008;z-index:4;opacity:0;pointer-events:none;transition:opacity .2s}
 .app.menu-open .mobile-backdrop{opacity:1;pointer-events:auto}
 .mobile-menu{display:grid}
 .topbar{height:58px;padding:0 13px}
 .content{padding:0 14px}
 .messages{padding:24px 1px 18px}
 .turn{gap:10px;margin-bottom:23px}
 .turn-avatar{width:29px;height:29px}
 .turn-text{font-size:13px}
 .composer-wrap{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
 .composer{border-radius:16px;padding:8px 8px 8px 13px}
 .composer textarea{font-size:16px}
 .suggestions{grid-template-columns:1fr}
 .welcome{justify-content:center;padding-bottom:25px}
 .welcome h1{font-size:34px}
 .top-tag{font-size:9px}
}
@media(max-width:390px){.content{padding:0 10px}.current-title{max-width:145px}.topbar{padding:0 9px}.top-right{gap:7px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="mobile-backdrop" id="backdrop"></div>
 <aside class="sidebar" aria-label="Chat navigation">
  <div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">COMBINZE</div><div class="brand-sub">AI SQUAD WORKSPACE</div></div></div>
  <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
  <div class="side-label"><span>Your conversations</span><span id="chatCount">0</span></div>
  <nav class="chat-list" id="chatList" aria-label="Your conversations"></nav>
  <div class="side-bottom">
   <div class="squad-mini-title">THE SQUAD · 5 MINDS</div>
   <div class="agent-mini"><span class="agent-dot">🧠</span> Thinker <span class="online"></span></div>
   <div class="agent-mini"><span class="agent-dot">🎨</span> Creator <span class="online"></span></div>
   <div class="agent-mini"><span class="agent-dot">🔎</span> Researcher <span class="online"></span></div>
   <div class="agent-mini"><span class="agent-dot">🛠️</span> Builder <span class="online"></span></div>
   <div class="agent-mini"><span class="agent-dot">✦</span> The Maker <span class="online"></span></div>
  </div>
 </aside>
 <main class="main">
  <header class="topbar">
   <div class="top-left"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="current-title" id="currentTitle">New chat</div></div>
   <div class="top-right"><span class="top-tag">● SQUAD ONLINE</span><button class="icon-btn" id="newChatTop" aria-label="Start a new chat" title="New chat">＋</button></div>
  </header>
  <section class="content">
   <div class="messages" id="messages" aria-live="polite"></div>
   <div class="composer-wrap">
    <form class="composer" id="chatForm">
     <textarea id="userInput" rows="1" maxlength="6000" placeholder="Message The Maker..." aria-label="Message The Maker"></textarea>
     <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">➤</button>
    </form>
    <div class="composer-note">The Maker brings all four specialists together. Your chats stay in this browser.</div>
   </div>
  </section>
 </main>
</div>
<script>
(function(){
"use strict";
const API_URL="https://combinze-maker.reedyjhaddon.workers.dev/chat";
const STORAGE_KEY="combinze_ai_squad_chats_v2";
const app=document.getElementById("app"),chatList=document.getElementById("chatList"),messagesEl=document.getElementById("messages"),input=document.getElementById("userInput"),form=document.getElementById("chatForm"),sendBtn=document.getElementById("sendBtn"),currentTitle=document.getElementById("currentTitle");
let chats=loadChats(),activeId=null,busy=false;
function id(){return "c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function loadChats(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(x))return x.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages)).slice(0,100)}catch(e){}return []}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats.slice(0,100)))}catch(e){showStorageNotice()}}
function showStorageNotice(){const n=document.getElementById("storageNotice");if(n)return;const el=document.createElement("div");el.id="storageNotice";el.className="composer-note";el.textContent="Browser storage is full. Older chats may not save.";document.querySelector(".composer-wrap").appendChild(el)}
function activeChat(){return chats.find(c=>c.id===activeId)||null}
function makeChat(){const c={id:id(),title:"New chat",createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.unshift(c);activeId=c.id;persist();renderAll();input.focus();closeMenu()}
function titleFrom(text){const t=text.replace(/\s+/g," ").trim();return t.length>34?t.slice(0,34)+"…":t||"New chat"}
function renderList(){
 chatList.innerHTML="";document.getElementById("chatCount").textContent=String(chats.length);
 if(!chats.length){const e=document.createElement("div");e.className="empty-list";e.textContent="Your new conversations will show up here.";chatList.appendChild(e);return}
 chats.forEach(c=>{
  const b=document.createElement("button");b.className="chat-item"+(c.id===activeId?" active":"");b.type="button";b.title=c.title;
  const sym=document.createElement("span");sym.className="chat-symbol";sym.textContent="✦";
  const title=document.createElement("span");title.className="chat-title";title.textContent=c.title;
  const del=document.createElement("span");del.className="delete-chat";del.textContent="×";del.setAttribute("role","button");del.setAttribute("aria-label","Delete "+c.title);del.title="Delete chat";
  del.addEventListener("click",ev=>{ev.stopPropagation();deleteChat(c.id)});
  b.append(sym,title,del);b.addEventListener("click",()=>{activeId=c.id;renderAll();closeMenu()});chatList.appendChild(b);
 });
}
function renderWelcome(){
 const wrap=document.createElement("div");wrap.className="welcome";
 const mark=document.createElement("div");mark.className="welcome-mark";mark.textContent="✦";
 const h=document.createElement("h1");h.append("One chat. ");const span=document.createElement("span");span.textContent="five minds.";h.appendChild(span);
 const p=document.createElement("p");p.textContent="Meet The Maker — your AI Squad coordinator. Four specialists think in parallel, then The Maker brings their ideas together into one answer.";
 const suggestions=document.createElement("div");suggestions.className="suggestions";
 [["🧠","Help me think through an idea","Explore options and make a clear plan."],["🎨","Create something original","Brainstorm concepts and creative directions."],["🔎","Research a topic","Break down a question and find what matters."],["🛠️","Help me build a project","Turn an idea into practical next steps."]].forEach(s=>{
  const b=document.createElement("button");b.className="suggestion";b.type="button";const strong=document.createElement("b");strong.textContent=s[0]+" "+s[1];const small=document.createElement("span");small.textContent=s[2];b.append(strong,small);b.addEventListener("click",()=>{input.value=s[1];resizeInput();input.focus()});suggestions.appendChild(b);
 });
 wrap.append(mark,h,p,suggestions);messagesEl.appendChild(wrap);
}
function addTurn(m){
 const row=document.createElement("article");row.className="turn "+(m.role==="user"?"user-turn":"assistant-turn");
 const av=document.createElement("div");av.className="turn-avatar";av.textContent=m.role==="user"?"●":"✦";
 const body=document.createElement("div");body.className="turn-body";
 const name=document.createElement("div");name.className="turn-name";name.textContent=m.role==="user"?"YOU":"THE MAKER";
 const text=document.createElement("div");text.className="turn-text";text.textContent=m.content||"";
 body.append(name,text);
 if(m.role==="assistant"&&m.contributions&&m.contributions.length){
  const details=document.createElement("details");details.className="turn-tools";const summary=document.createElement("summary");summary.className="tiny-btn";summary.textContent="See specialist contributions";details.appendChild(summary);
  m.contributions.forEach(c=>{const part=document.createElement("div");part.style.cssText="font-size:12px;line-height:1.6;color:#9da9bd;margin-top:10px;white-space:pre-wrap";part.textContent=(c.name||c.agent||"Specialist")+": "+(c.reply||c.error||"No response");details.appendChild(part)});body.appendChild(details);
 }
 row.append(av,body);messagesEl.appendChild(row);
}
function renderMessages(){
 messagesEl.innerHTML="";const c=activeChat();if(!c||!c.messages.length){renderWelcome();return}
 c.messages.forEach(addTurn);scrollBottom();
}
function renderAll(){const c=activeChat();currentTitle.textContent=c?c.title:"New chat";renderList();renderMessages()}
function scrollBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}
function deleteChat(chatId){const c=chats.find(x=>x.id===chatId);if(!c)return;if(!confirm("Delete this conversation? This cannot be undone."))return;chats=chats.filter(x=>x.id!==chatId);if(activeId===chatId)activeId=chats[0]?.id||null;persist();renderAll()}
function closeMenu(){app.classList.remove("menu-open")}
function openMenu(){app.classList.add("menu-open")}
function resizeInput(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px"}
function setBusy(v){busy=v;sendBtn.disabled=v;input.disabled=v;sendBtn.textContent=v?"…":"➤"}
function buildContext(c){return c.messages.slice(-12).map(m=>(m.role==="user"?"User":"The Maker")+": "+m.content).join("\n\n").slice(-7500)}
async function sendMessage(raw){
 const value=raw.trim();if(!value||busy)return;
 if(!activeChat())makeChat();
 const c=activeChat();if(!c)return;
 c.messages.push({role:"user",content:value,at:Date.now()});
 if(c.title==="New chat")c.title=titleFrom(value);
 c.updatedAt=Date.now();chats.sort((a,b)=>b.updatedAt-a.updatedAt);persist();renderAll();
 input.value="";resizeInput();setBusy(true);
 const pending=document.createElement("article");pending.className="turn assistant-turn";
 const avatar=document.createElement("div");avatar.className="turn-avatar";avatar.textContent="✦";
 const body=document.createElement("div");body.className="turn-body";
 const name=document.createElement("div");name.className="turn-name";name.textContent="THE MAKER";
 const status=document.createElement("div");status.className="turn-text";status.textContent="Bringing the squad together";
 const dots=document.createElement("div");dots.className="thinking-dots";for(let i=0;i<3;i++)dots.appendChild(document.createElement("i"));
 body.append(name,status,dots);pending.append(avatar,body);messagesEl.appendChild(pending);scrollBottom();
 try{
  const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:value,context:buildContext({...c,messages:c.messages.slice(0,-1)})})});
  let data;try{data=await response.json()}catch(e){throw new Error("The Maker returned an unreadable response.")}
  if(!response.ok)throw new Error(data.error||"The squad couldn't complete that request.");
  const reply=typeof data.reply==="string"&&data.reply.trim()?data.reply.trim():"The Maker didn't return a final answer.";
  c.messages.push({role:"assistant",content:reply,contributions:Array.isArray(data.contributions)?data.contributions:[],at:Date.now()});
  c.updatedAt=Date.now();persist();pending.remove();addTurn(c.messages[c.messages.length-1]);renderList();currentTitle.textContent=c.title;
 }catch(err){
  status.classList.add("error");status.textContent="Couldn't reach The Maker: "+(err&&err.message?err.message:"Unknown error");
  dots.remove();
  const retry=document.createElement("button");retry.className="tiny-btn";retry.textContent="Try again";retry.addEventListener("click",()=>{pending.remove();c.messages.pop();persist();sendMessage(value)});body.appendChild(retry);
 }finally{setBusy(false);input.focus();scrollBottom()}
}
form.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value)});
input.addEventListener("input",resizeInput);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.getElementById("newChat").addEventListener("click",makeChat);
document.getElementById("newChatTop").addEventListener("click",makeChat);
document.getElementById("menuBtn").addEventListener("click",openMenu);
document.getElementById("backdrop").addEventListener("click",closeMenu);
if(!activeId&&chats.length)activeId=chats[0].id;
renderAll();
})();
</script>
</body>
</html>
